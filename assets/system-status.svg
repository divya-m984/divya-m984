<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180"
     role="img" aria-label="Animated system status showing active development and open-source focus">
  <defs>
    <pattern id="sg" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#29334F" stroke-width="0.35"/>
    </pattern>
    <clipPath id="sclip">
      <rect x="2" y="2" width="796" height="176" rx="3"/>
    </clipPath>
    <style>
      @keyframes sblink { 0%,48%{opacity:1} 50%,98%{opacity:0} 100%{opacity:1} }
      @keyframes sdot   { 0%,100%{opacity:1} 50%{opacity:0.2} }
      @keyframes sflick { 0%,92%,100%{opacity:1} 93%{opacity:0.35} 96%{opacity:0.7} }
      .scursor { animation: sblink 1s step-start infinite; }
      .sdot1   { animation: sdot 2s ease-in-out infinite; }
      .sdot2   { animation: sdot 2s ease-in-out 0.5s infinite; }
      .sdot3   { animation: sdot 2s ease-in-out 1s infinite; }
      .sdot4   { animation: sdot 2s ease-in-out 1.5s infinite; }
      .sflick  { animation: sflick 5s step-end infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="180" fill="#070A12" rx="4"/>
  <rect width="800" height="180" fill="url(#sg)" opacity="0.45" rx="4"/>

  <!-- Scanlines overlay -->
  <rect width="800" height="180" fill="none" rx="4"
        stroke="#000" stroke-width="0" opacity="0">
  </rect>
  <!-- Repeating scanline rows -->
  <g clip-path="url(#sclip)" opacity="0.08">
    <rect x="0" y="0"   width="800" height="2" fill="#000"/>
    <rect x="0" y="4"   width="800" height="2" fill="#000"/>
    <rect x="0" y="8"   width="800" height="2" fill="#000"/>
    <rect x="0" y="12"  width="800" height="2" fill="#000"/>
    <rect x="0" y="16"  width="800" height="2" fill="#000"/>
    <rect x="0" y="20"  width="800" height="2" fill="#000"/>
    <rect x="0" y="24"  width="800" height="2" fill="#000"/>
    <rect x="0" y="28"  width="800" height="2" fill="#000"/>
    <rect x="0" y="32"  width="800" height="2" fill="#000"/>
    <rect x="0" y="36"  width="800" height="2" fill="#000"/>
    <rect x="0" y="40"  width="800" height="2" fill="#000"/>
    <rect x="0" y="44"  width="800" height="2" fill="#000"/>
    <rect x="0" y="48"  width="800" height="2" fill="#000"/>
    <rect x="0" y="52"  width="800" height="2" fill="#000"/>
    <rect x="0" y="56"  width="800" height="2" fill="#000"/>
    <rect x="0" y="60"  width="800" height="2" fill="#000"/>
    <rect x="0" y="64"  width="800" height="2" fill="#000"/>
    <rect x="0" y="68"  width="800" height="2" fill="#000"/>
    <rect x="0" y="72"  width="800" height="2" fill="#000"/>
    <rect x="0" y="76"  width="800" height="2" fill="#000"/>
    <rect x="0" y="80"  width="800" height="2" fill="#000"/>
    <rect x="0" y="84"  width="800" height="2" fill="#000"/>
    <rect x="0" y="88"  width="800" height="2" fill="#000"/>
    <rect x="0" y="92"  width="800" height="2" fill="#000"/>
    <rect x="0" y="96"  width="800" height="2" fill="#000"/>
    <rect x="0" y="100" width="800" height="2" fill="#000"/>
    <rect x="0" y="104" width="800" height="2" fill="#000"/>
    <rect x="0" y="108" width="800" height="2" fill="#000"/>
    <rect x="0" y="112" width="800" height="2" fill="#000"/>
    <rect x="0" y="116" width="800" height="2" fill="#000"/>
    <rect x="0" y="120" width="800" height="2" fill="#000"/>
    <rect x="0" y="124" width="800" height="2" fill="#000"/>
    <rect x="0" y="128" width="800" height="2" fill="#000"/>
    <rect x="0" y="132" width="800" height="2" fill="#000"/>
    <rect x="0" y="136" width="800" height="2" fill="#000"/>
    <rect x="0" y="140" width="800" height="2" fill="#000"/>
    <rect x="0" y="144" width="800" height="2" fill="#000"/>
    <rect x="0" y="148" width="800" height="2" fill="#000"/>
    <rect x="0" y="152" width="800" height="2" fill="#000"/>
    <rect x="0" y="156" width="800" height="2" fill="#000"/>
    <rect x="0" y="160" width="800" height="2" fill="#000"/>
    <rect x="0" y="164" width="800" height="2" fill="#000"/>
    <rect x="0" y="168" width="800" height="2" fill="#000"/>
    <rect x="0" y="172" width="800" height="2" fill="#000"/>
    <rect x="0" y="176" width="800" height="2" fill="#000"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="178" fill="none" stroke="#28D7FE" stroke-width="0.8" rx="4" opacity="0.45"/>

  <!-- Corner accents -->
  <path d="M2,2 L22,2 M2,2 L2,22"   fill="none" stroke="#28D7FE" stroke-width="1.5"/>
  <path d="M798,2 L778,2 M798,2 L798,22"   fill="none" stroke="#28D7FE" stroke-width="1.5"/>
  <path d="M2,178 L22,178 M2,178 L2,158" fill="none" stroke="#28D7FE" stroke-width="1.5"/>
  <path d="M798,178 L778,178 M798,178 L798,158" fill="none" stroke="#28D7FE" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="2" y="2" width="796" height="26" fill="#0B1020" opacity="0.9"/>
  <text x="400" y="19" font-family="monospace,Courier New,Courier" font-size="8"
        fill="#9AA7C7" text-anchor="middle" letter-spacing="4">SYSTEM MONITORING INTERFACE</text>
  <line x1="2" y1="28" x2="798" y2="28" stroke="#29334F" stroke-width="0.7"/>

  <!-- Status items — four columns -->

  <!-- 1: STATUS -->
  <text x="80" y="52" font-family="monospace,Courier New,Courier" font-size="8"
        fill="#9AA7C7" text-anchor="middle" letter-spacing="3">STATUS</text>
  <circle cx="65" cy="72" r="5" fill="#28D7FE" class="sdot1"/>
  <text x="76" y="77" font-family="monospace,Courier New,Courier" font-size="15"
        fill="#28D7FE" class="sflick">ACTIVE</text>
  <rect x="159" y="63" width="7" height="15" fill="#28D7FE" class="scursor"/>

  <!-- 2: MODE -->
  <text x="270" y="52" font-family="monospace,Courier New,Courier" font-size="8"
        fill="#9AA7C7" text-anchor="middle" letter-spacing="3">MODE</text>
  <circle cx="253" cy="72" r="5" fill="#8B5CF6" class="sdot2"/>
  <text x="264" y="77" font-family="monospace,Courier New,Courier" font-size="15"
        fill="#8B5CF6">BUILDING</text>

  <!-- 3: FOCUS -->
  <text x="480" y="52" font-family="monospace,Courier New,Courier" font-size="8"
        fill="#9AA7C7" text-anchor="middle" letter-spacing="3">FOCUS</text>
  <circle cx="460" cy="72" r="5" fill="#6E8EFF" class="sdot3"/>
  <text x="471" y="77" font-family="monospace,Courier New,Courier" font-size="15"
        fill="#6E8EFF">OPEN SOURCE</text>

  <!-- 4: UPLINK -->
  <text x="700" y="52" font-family="monospace,Courier New,Courier" font-size="8"
        fill="#9AA7C7" text-anchor="middle" letter-spacing="3">UPLINK</text>
  <circle cx="681" cy="72" r="5" fill="#28D7FE" class="sdot4"/>
  <text x="692" y="77" font-family="monospace,Courier New,Courier" font-size="15"
        fill="#28D7FE">ONLINE</text>

  <!-- Separator -->
  <line x1="12" y1="92" x2="788" y2="92" stroke="#29334F" stroke-width="0.6"/>

  <!-- Activity label -->
  <text x="12" y="108" font-family="monospace,Courier New,Courier" font-size="7"
        fill="#8B5CF6" letter-spacing="2">ACTIVITY</text>

  <!-- Waveform base (static, faint) -->
  <path d="M12,130 L30,130 L36,118 L42,142 L48,124 L54,136 L60,120 L66,138
           L72,128 L78,130 L84,118 L90,142 L96,126 L102,136 L108,120 L114,140
           L120,130 L126,122 L132,138 L138,120 L144,132 L150,128 L156,130
           L162,118 L168,142 L174,126 L180,136 L186,122 L192,130 L200,130
           L210,122 L216,136 L222,120 L228,138 L234,130 L250,130"
        fill="none" stroke="#8B5CF6" stroke-width="0.7" opacity="0.25"/>

  <!-- Waveform animated (cyan, travelling) -->
  <path d="M12,130 L30,130 L36,118 L42,142 L48,124 L54,136 L60,120 L66,138
           L72,128 L78,130 L84,118 L90,142 L96,126 L102,136 L108,120 L114,140
           L120,130 L126,122 L132,138 L138,120 L144,132 L150,128 L156,130
           L162,118 L168,142 L174,126 L180,136 L186,122 L192,130 L200,130
           L210,122 L216,136 L222,120 L228,138 L234,130 L250,130"
        fill="none" stroke="#28D7FE" stroke-width="1.5"
        stroke-dasharray="150 500">
    <animate attributeName="stroke-dashoffset" from="150" to="-150" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- Loading sweep box -->
  <rect x="262" y="100" width="524" height="58" fill="#0B1020" rx="2" opacity="0.7"/>
  <rect x="262" y="100" width="524" height="58" fill="none" stroke="#29334F" stroke-width="0.6" rx="2"/>

  <!-- Loading sweep bar (animates width) -->
  <rect x="262" y="100" width="0" height="58" fill="#28D7FE" opacity="0.05" rx="2">
    <animate attributeName="width" values="0;524;524;0" keyTimes="0;0.6;0.9;1"
             dur="8s" repeatCount="indefinite"/>
  </rect>
  <!-- Loading sweep leading edge -->
  <rect x="262" y="100" width="3" height="58" fill="#28D7FE" opacity="0.35" rx="1">
    <animate attributeName="x" values="262;783;783;262" keyTimes="0;0.6;0.9;1"
             dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0;0" keyTimes="0;0.6;0.62;1"
             dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- GSoC target text in sweep box -->
  <text x="524" y="127" font-family="monospace,Courier New,Courier" font-size="8"
        fill="#29334F" text-anchor="middle" letter-spacing="2">TARGET: GSoC 2027</text>
  <text x="524" y="143" font-family="monospace,Courier New,Courier" font-size="8"
        fill="#29334F" text-anchor="middle" letter-spacing="2">BUILD: CONTINUOUS</text>

  <!-- Footer line -->
  <line x1="2" y1="166" x2="798" y2="166" stroke="#29334F" stroke-width="0.5"/>
  <text x="12" y="176" font-family="monospace,Courier New,Courier" font-size="7"
        fill="#29334F">NODE: DM-984 // ARCH LINUX // OPEN SOURCE</text>
  <text x="788" y="176" font-family="monospace,Courier New,Courier" font-size="7"
        fill="#29334F" text-anchor="end">v2.4.1</text>
</svg>
