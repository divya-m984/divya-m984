<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="presentation">
  <defs>
    <linearGradient id="dline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#28D7FE" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#28D7FE" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="80%"  stop-color="#28D7FE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#28D7FE" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes dpulse { 0%,100%{opacity:0.9} 50%{opacity:0.4} }
      .dnode { animation: dpulse 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base line -->
  <line x1="0" y1="20" x2="1000" y2="20" stroke="#29334F" stroke-width="0.8"/>
  <!-- Gradient overlay -->
  <line x1="0" y1="20" x2="1000" y2="20" stroke="url(#dline)" stroke-width="0.8"/>

  <!-- Major ticks (every 100px) -->
  <line x1="100" y1="14" x2="100" y2="26" stroke="#29334F" stroke-width="0.6"/>
  <line x1="200" y1="14" x2="200" y2="26" stroke="#29334F" stroke-width="0.6"/>
  <line x1="300" y1="14" x2="300" y2="26" stroke="#29334F" stroke-width="0.6"/>
  <line x1="400" y1="14" x2="400" y2="26" stroke="#29334F" stroke-width="0.6"/>
  <line x1="600" y1="14" x2="600" y2="26" stroke="#29334F" stroke-width="0.6"/>
  <line x1="700" y1="14" x2="700" y2="26" stroke="#29334F" stroke-width="0.6"/>
  <line x1="800" y1="14" x2="800" y2="26" stroke="#29334F" stroke-width="0.6"/>
  <line x1="900" y1="14" x2="900" y2="26" stroke="#29334F" stroke-width="0.6"/>

  <!-- Minor ticks (every 50px) -->
  <line x1="50"  y1="17" x2="50"  y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="150" y1="17" x2="150" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="250" y1="17" x2="250" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="350" y1="17" x2="350" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="450" y1="17" x2="450" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="550" y1="17" x2="550" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="650" y1="17" x2="650" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="750" y1="17" x2="750" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="850" y1="17" x2="850" y2="23" stroke="#29334F" stroke-width="0.4"/>
  <line x1="950" y1="17" x2="950" y2="23" stroke="#29334F" stroke-width="0.4"/>

  <!-- Central diamond node -->
  <polygon points="500,12 508,20 500,28 492,20" fill="#0B1020" stroke="#29334F" stroke-width="1"/>
  <polygon points="500,12 508,20 500,28 492,20" fill="#0B1020" stroke="#28D7FE" stroke-width="0.8" class="dnode"/>
  <polygon points="500,16 504,20 500,24 496,20" fill="#8B5CF6" opacity="0.7" class="dnode"/>

  <!-- Animated cyan pulse travelling left to right -->
  <line x1="0" y1="20" x2="1000" y2="20" stroke="#28D7FE" stroke-width="2"
        stroke-dasharray="55 1000" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="1055" to="-55" dur="4s"
             repeatCount="indefinite"/>
  </line>

  <!-- Secondary violet pulse (slower, offset) -->
  <line x1="0" y1="20" x2="1000" y2="20" stroke="#8B5CF6" stroke-width="1.5"
        stroke-dasharray="28 1000" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="1028" to="-28" dur="6.5s"
             repeatCount="indefinite"/>
  </line>

  <!-- Node outer glow pulse -->
  <polygon points="500,10 510,20 500,30 490,20" fill="none" stroke="#28D7FE" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/>
  </polygon>
</svg>
