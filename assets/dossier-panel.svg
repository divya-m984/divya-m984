<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420"
     role="img" aria-label="Profile card for Divya M, multidisciplinary developer">
  <defs>
    <!-- Ambient glow behind globe -->
    <radialGradient id="gg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#28D7FE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#28D7FE" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle background tint on globe side -->
    <radialGradient id="bg" cx="75%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes gp { 0%,100%{opacity:0.55} 50%{opacity:1} }
      @keyframes gr { 0%,100%{opacity:0.18} 50%{opacity:0.38} }
      .glow  { animation: gp 6s ease-in-out infinite; }
      .gring { animation: gr 6s ease-in-out 1s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="#070A12" rx="6"/>
  <rect x="1" y="1" width="998" height="418" fill="#0A0F1E" rx="5"/>
  <!-- Background tint (globe side) -->
  <rect x="1" y="1" width="998" height="418" fill="url(#bg)" rx="5"/>
  <!-- Border -->
  <rect x="1" y="1" width="998" height="418" fill="none" stroke="#28D7FE" stroke-width="0.7" rx="5" opacity="0.25"/>
  <!-- Corner brackets -->
  <path d="M2,2 L30,2 M2,2 L2,30"     fill="none" stroke="#28D7FE" stroke-width="1.5"/>
  <path d="M998,2 L970,2 M998,2 L998,30"   fill="none" stroke="#28D7FE" stroke-width="1.5"/>
  <path d="M2,418 L30,418 M2,418 L2,390"   fill="none" stroke="#28D7FE" stroke-width="1.5"/>
  <path d="M998,418 L970,418 M998,418 L998,390" fill="none" stroke="#28D7FE" stroke-width="1.5"/>

  <!-- Column divider -->
  <line x1="478" y1="32" x2="478" y2="388" stroke="#1A2440" stroke-width="1"/>

  <!-- ════════════════════════════════════════════
       LEFT COLUMN
       ════════════════════════════════════════════ -->

  <!-- NAME -->
  <text x="44" y="68"
        font-family="monospace,Courier New,Courier" font-size="9"
        fill="#8B5CF6" letter-spacing="3">NAME</text>
  <text x="44" y="100"
        font-family="sans-serif,Arial,Helvetica" font-size="27"
        fill="#F4F7FF" font-weight="300" letter-spacing="2">Divya M</text>

  <line x1="44" y1="115" x2="455" y2="115" stroke="#1A2440" stroke-width="1"/>

  <!-- INTERESTS -->
  <text x="44" y="138"
        font-family="monospace,Courier New,Courier" font-size="9"
        fill="#8B5CF6" letter-spacing="3">INTERESTS</text>

  <text x="44" y="160" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Software Engineering</text>
  <text x="44" y="178" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Machine Learning &amp; MLOps</text>
  <text x="44" y="196" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Linux Systems</text>
  <text x="44" y="214" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Real-Time Systems</text>
  <text x="44" y="232" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Sustainability Technology</text>
  <text x="44" y="250" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Marine Technology</text>
  <text x="44" y="268" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Cybersecurity</text>
  <text x="44" y="286" font-family="sans-serif,Arial,Helvetica" font-size="12.5" fill="#9AA7C7">&#x2014; Open Source</text>

  <line x1="44" y1="301" x2="455" y2="301" stroke="#1A2440" stroke-width="1"/>

  <!-- SKILLS -->
  <text x="44" y="323"
        font-family="monospace,Courier New,Courier" font-size="9"
        fill="#8B5CF6" letter-spacing="3">SKILLS</text>

  <text x="44" y="344" font-family="monospace,Courier New,Courier" font-size="10.5" fill="#6E8EFF">Python · TypeScript · JavaScript</text>
  <text x="44" y="363" font-family="monospace,Courier New,Courier" font-size="10.5" fill="#6E8EFF">React · FastAPI · Node.js</text>
  <text x="44" y="382" font-family="monospace,Courier New,Courier" font-size="10.5" fill="#6E8EFF">Docker · PostgreSQL · GitHub Actions</text>
  <text x="44" y="401" font-family="monospace,Courier New,Courier" font-size="10.5" fill="#6E8EFF">Arch Linux · Scikit-learn · MLflow</text>

  <!-- ════════════════════════════════════════════
       RIGHT COLUMN — GLOBE
       Globe center: (740, 210)  R = 148
       ════════════════════════════════════════════ -->

  <!-- Ambient glow -->
  <circle cx="740" cy="210" r="158" fill="url(#gg)" class="glow"/>

  <!-- Outer haze ring -->
  <circle cx="740" cy="210" r="153" fill="none" stroke="#28D7FE" stroke-width="1.5"
          opacity="0.06" class="gring"/>
  <circle cx="740" cy="210" r="150" fill="none" stroke="#28D7FE" stroke-width="0.5"
          opacity="0.12" class="gring"/>

  <!-- Static latitude lines (orthographic, ~15° elevation) -->
  <!-- Equator -->
  <ellipse cx="740" cy="210" rx="148" ry="38"
           fill="none" stroke="#29334F" stroke-width="0.9" opacity="0.8"/>
  <!-- 30°N / 30°S -->
  <ellipse cx="740" cy="139" rx="128" ry="33"
           fill="none" stroke="#29334F" stroke-width="0.65" opacity="0.6"/>
  <ellipse cx="740" cy="281" rx="128" ry="33"
           fill="none" stroke="#29334F" stroke-width="0.65" opacity="0.6"/>
  <!-- 60°N / 60°S -->
  <ellipse cx="740" cy="86"  rx="74"  ry="19"
           fill="none" stroke="#29334F" stroke-width="0.5" opacity="0.42"/>
  <ellipse cx="740" cy="334" rx="74"  ry="19"
           fill="none" stroke="#29334F" stroke-width="0.5" opacity="0.42"/>

  <!-- Globe border circle -->
  <circle cx="740" cy="210" r="148" fill="none" stroke="#28D7FE" stroke-width="1.1" opacity="0.58"/>

  <!-- Animated longitude meridians — three ellipses phase-shifted 3s apart (dur=9s)
       Each sweeps rx: 0 → 148 → 0 simulating a meridian rotating around the globe.
       Phase offsets create 3 meridians always at different apparent widths.
       Initial rx attributes are best-guess static values for no-animation fallback. -->

  <!-- Meridian 1: starts from edge-on, sweeps to face-on -->
  <ellipse cx="740" cy="210" rx="2" ry="148"
           fill="none" stroke="#28D7FE" stroke-width="1" opacity="0.62">
    <animate attributeName="rx"
             values="2;148;2" keyTimes="0;0.5;1"
             calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
             dur="9s" begin="0s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Meridian 2: 3s ahead in the cycle -->
  <ellipse cx="740" cy="210" rx="100" ry="148"
           fill="none" stroke="#6E8EFF" stroke-width="0.85" opacity="0.44">
    <animate attributeName="rx"
             values="2;148;2" keyTimes="0;0.5;1"
             calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
             dur="9s" begin="-3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Meridian 3: 6s ahead in the cycle -->
  <ellipse cx="740" cy="210" rx="100" ry="148"
           fill="none" stroke="#8B5CF6" stroke-width="0.7" opacity="0.32">
    <animate attributeName="rx"
             values="2;148;2" keyTimes="0;0.5;1"
             calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
             dur="9s" begin="-6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Globe centre dot -->
  <circle cx="740" cy="210" r="2.5" fill="#28D7FE" opacity="0.45"/>
</svg>
