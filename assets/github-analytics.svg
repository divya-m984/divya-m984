<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 650"
     width="1200" height="650"
     role="img"
     aria-label="GitHub analytics for divya-m984 — pending first workflow run">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="100%" stop-color="#06101E"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#28D7FE" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="648" rx="8" ry="8"
        fill="none" stroke="url(#border)" stroke-width="1.5" opacity="0.75"/>

  <!-- Header separator -->
  <line x1="40" y1="66" x2="1160" y2="66" stroke="#1A2840" stroke-width="1"/>

  <!-- Title -->
  <text x="40" y="40"
        font-family="'Courier New',monospace"
        font-size="12" font-weight="700" letter-spacing="3.5"
        fill="#28D7FE" opacity="0.9">GITHUB ANALYTICS</text>
  <text x="40" y="58"
        font-family="'Courier New',monospace"
        font-size="9" letter-spacing="1.5"
        fill="#4F8CFF" opacity="0.6">divya-m984</text>

  <!-- Pending notice -->
  <rect x="350" y="230" width="500" height="130" rx="6" fill="#080F1F" opacity="0.9"/>
  <rect x="350" y="230" width="500" height="2"   rx="1" fill="#28D7FE" opacity="0.5"/>

  <text x="600" y="282" text-anchor="middle"
        font-family="'Courier New',monospace"
        font-size="11" font-weight="700" letter-spacing="2"
        fill="#28D7FE" opacity="0.75">ANALYTICS DASHBOARD</text>

  <text x="600" y="302" text-anchor="middle"
        font-family="'Courier New',monospace"
        font-size="9" letter-spacing="1"
        fill="#A7B2CE" opacity="0.5">Will be populated on first workflow run.</text>

  <text x="600" y="324" text-anchor="middle"
        font-family="'Courier New',monospace"
        font-size="8" letter-spacing="1"
        fill="#4F8CFF" opacity="0.4">Trigger: Update GitHub Analytics (workflow_dispatch)</text>

  <text x="600" y="344" text-anchor="middle"
        font-family="'Courier New',monospace"
        font-size="8" letter-spacing="1"
        fill="#A7B2CE" opacity="0.3">or wait for the scheduled run at 03:30 UTC daily</text>

  <!-- Footer -->
  <line x1="40" y1="620" x2="1160" y2="620" stroke="#182336" stroke-width="1" opacity="0.6"/>
  <text x="600" y="637" text-anchor="middle"
        font-family="'Courier New',monospace"
        font-size="7.5" fill="#A7B2CE" opacity="0.3">
    Public repository language distribution reflects repository contents, not proficiency.
  </text>

</svg>
